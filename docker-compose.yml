services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rudra_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Rudra
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:////app/rudra.db
      - SECRET_KEY=${SECRET_KEY:-rudra-super-secret-production-grade-signing-key-minimum-32-chars-xyz-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8000}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-backend}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rudra_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
